---
- name: Create Amazon FSx for NetApp ONTAP File System
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Fail if variables not defined
      ansible.builtin.assert:
        that:
          - create_fsx_ontap_aws_vpc_subnet_name is defined
          - create_fsx_ontap_aws_securitygroup_name is defined
          - create_fsx_ontap_aws_name is defined
          - create_fsx_ontap_aws_region is defined
          - create_fsx_ontap_stack_name is defined
          - create_fsx_ontap_aws_owner_tag is defined
          - create_fsx_ontap_aws_environment is defined
        fail_msg: "Required variables not set"

    - name: Include create fsx ontap role
      ansible.builtin.include_role:
        name: demo.cloud.aws
        tasks_from: create_fsx_ontap
...
