---
- name: Delete Amazon FSx for NetApp ONTAP File System
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Fail if variables not defined
      ansible.builtin.assert:
        that:
          - delete_fsx_ontap_aws_region is defined
          - delete_fsx_ontap_stack_name is defined
        fail_msg: "delete_fsx_ontap_aws_region and delete_fsx_ontap_stack_name are required"

    - name: Include delete fsx ontap role
      ansible.builtin.include_role:
        name: demo.cloud.aws
        tasks_from: delete_fsx_ontap

    - name: Remove FSx ONTAP host from the AAP inventory
      ansible.controller.host:
        name: "{{ delete_fsx_ontap_aws_name }}"
        inventory: "{{ delete_fsx_ontap_inventory_name | default('Ansible Product Demos Storage Inventory') }}"
        state: absent
      when: delete_fsx_ontap_aws_name is defined
