---
# Registers an EC2 VM (created by create_vm.yml) as an AAP execution node:
#   1. create the instance in AAP (node_type=execution) and download its install bundle
#   2. install receptor on the VM using the bundle's settings (ansible.receptor.setup)
#   3. add the instance to an instance group and wait for it to become ready
#
# Requires: AAP Credential (injects CONTROLLER_*), AWS credential, a machine
# credential that can SSH/sudo on the VM, and network reachability from the AAP
# control/hop nodes to the VM on the receptor listener port (default 27199).

- name: Register the VM as an AAP execution node (controller side)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    register_execution_node_listener_port: 27199
    register_execution_node_instance_group: storage
    register_execution_node_api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}/api/controller/v2"
    register_execution_node_token: "{{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"
  module_defaults:
    ansible.builtin.uri:
      headers: "{{ {'Authorization': 'Bearer ' ~ register_execution_node_token} if register_execution_node_token | length > 0 else {} }}"
      url_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') if register_execution_node_token | length == 0 else omit }}"
      url_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') if register_execution_node_token | length == 0 else omit }}"
      force_basic_auth: "{{ register_execution_node_token | length == 0 }}"
      validate_certs: "{{ (lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') | default('true', true)) | bool }}"
  tasks:
    # Deploy a Storage Stack on AWS supplies the region as create_vm_aws_region.
    - name: Default the region from the shared workflow survey answer
      ansible.builtin.set_fact:
        register_execution_node_aws_region: "{{ create_vm_aws_region }}"
      when:
        - lookup('ansible.builtin.vars', 'register_execution_node_aws_region', default='') | length == 0
        - lookup('ansible.builtin.vars', 'create_vm_aws_region', default='') | length > 0

    - name: Fail if variables not defined
      ansible.builtin.assert:
        that:
          - register_execution_node_vm_name is defined
          - register_execution_node_aws_region is defined
        fail_msg: "register_execution_node_vm_name and register_execution_node_aws_region are required"

    - name: Find the VM
      amazon.aws.ec2_instance_info:
        region: "{{ register_execution_node_aws_region }}"
        filters:
          tag:Name: "{{ register_execution_node_vm_name }}"
          tag:apd: "true"
          instance-state-name: running
      register: register_execution_node_vm

    - name: Fail if the VM was not found
      ansible.builtin.assert:
        that: register_execution_node_vm.instances | length == 1
        fail_msg: "Expected exactly one running VM named {{ register_execution_node_vm_name }}"

    # AAP control nodes must reach this address on the listener port.
    - name: Set the node address
      ansible.builtin.set_fact:
        register_execution_node_hostname: >-
          {{ register_execution_node_vm.instances[0].public_dns_name
             | default(register_execution_node_vm.instances[0].private_ip_address, true) }}

    - name: Create the execution node in AAP
      ansible.controller.instance:
        hostname: "{{ register_execution_node_hostname }}"
        node_type: execution
        listener_port: "{{ register_execution_node_listener_port }}"
        peers_from_control_nodes: true

    - name: Look up the AAP instance
      ansible.builtin.uri:
        url: "{{ register_execution_node_api }}/instances/?hostname={{ register_execution_node_hostname }}"
      register: register_execution_node_lookup

    - name: Set the AAP instance id
      ansible.builtin.set_fact:
        register_execution_node_instance_id: "{{ register_execution_node_lookup.json.results[0].id }}"

    - name: Create a working directory for the install bundle
      ansible.builtin.tempfile:
        state: directory
        prefix: exec_node_bundle_
      register: register_execution_node_workdir

    - name: Download the install bundle
      ansible.builtin.uri:
        url: "{{ register_execution_node_api }}/instances/{{ register_execution_node_instance_id }}/install_bundle/"
        dest: "{{ register_execution_node_workdir.path }}/bundle.tar.gz"
        return_content: false

    - name: Extract the install bundle
      ansible.builtin.unarchive:
        src: "{{ register_execution_node_workdir.path }}/bundle.tar.gz"
        dest: "{{ register_execution_node_workdir.path }}"
        remote_src: true

    - name: List the install bundle files
      ansible.builtin.find:
        paths: "{{ register_execution_node_workdir.path }}"
        file_type: file
        recurse: true
      register: register_execution_node_bundle_files

    - name: Show the install bundle files
      ansible.builtin.debug:
        msg: "{{ register_execution_node_bundle_files.files | map(attribute='path') | map('regex_replace', '^' ~ register_execution_node_workdir.path ~ '/', '') | sort }}"

    - name: Locate the bundle playbook and inventory
      ansible.builtin.set_fact:
        register_execution_node_bundle_playbook: >-
          {{ register_execution_node_bundle_files.files | map(attribute='path')
             | select('match', '.*/install_receptor[.]ya?ml$') | first | default('') }}
        register_execution_node_bundle_inventory: >-
          {{ register_execution_node_bundle_files.files | map(attribute='path')
             | select('match', '.*/inventory[.]ya?ml$') | first | default('') }}

    - name: Fail if the bundle has no install playbook
      ansible.builtin.assert:
        that: register_execution_node_bundle_playbook | length > 0
        fail_msg: >-
          install_receptor.yml was not found in the install bundle; see the file
          list above for what the bundle contains.

    - name: Read the bundle playbook
      ansible.builtin.slurp:
        src: "{{ register_execution_node_bundle_playbook }}"
      register: register_execution_node_playbook_raw

    - name: Read the bundle inventory
      ansible.builtin.slurp:
        src: "{{ register_execution_node_bundle_inventory }}"
      register: register_execution_node_inventory_raw
      when: register_execution_node_bundle_inventory | length > 0

    # The bundle's YAML files hold settings and file names, not keys or
    # certificates (those are under receptor/), so they are safe to print.
    - name: Show the bundle playbook
      ansible.builtin.debug:
        msg: "{{ (register_execution_node_playbook_raw.content | b64decode).splitlines() }}"

    - name: Show the bundle inventory
      ansible.builtin.debug:
        msg: "{{ (register_execution_node_inventory_raw.content | b64decode).splitlines() }}"
      when: register_execution_node_inventory_raw is not skipped

    # The receptor settings are role variables in the bundle's install_receptor.yml
    # (play vars, role vars or task vars); the inventory only holds connection
    # details. Merge every source so the layout does not matter, with the play
    # settings taking precedence over inventory ones.
    - name: Collect receptor settings from the bundle
      ansible.builtin.set_fact:
        register_execution_node_bundle_settings: >-
          {{ ( [ ( (register_execution_node_inventory_raw.content | default('e30=') | b64decode | from_yaml).all.hosts.values() | first | default({}) )
                 if register_execution_node_inventory_raw is not skipped else {} ]
               + [ (register_execution_node_playbook_raw.content | b64decode | from_yaml | first).vars | default({}) ]
               + (register_execution_node_playbook_raw.content | b64decode | from_yaml | first).roles | default([])
                   | selectattr('vars', 'defined') | map(attribute='vars') | list
               + (register_execution_node_playbook_raw.content | b64decode | from_yaml | first).tasks | default([])
                   | selectattr('vars', 'defined') | map(attribute='vars') | list
             ) | combine }}

    # Settings that are file paths (custom_*file) are relative to the bundle
    # directory, so make them absolute. Connection settings are not receptor's.
    - name: Build receptor settings from the bundle
      ansible.builtin.set_fact:
        register_execution_node_receptor_vars: >-
          {{ register_execution_node_receptor_vars | default({}) | combine({
               item.key: (register_execution_node_bundle_playbook | dirname ~ '/' ~ item.value)
                         if (item.key.startswith('custom_') and item.key.endswith('file')
                             and item.value is string and not item.value.startswith('/'))
                         else item.value }) }}
      loop: "{{ register_execution_node_bundle_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: not item.key.startswith('ansible_')

    - name: Fail if no receptor settings were found
      ansible.builtin.assert:
        that: register_execution_node_receptor_vars | default({}) | length > 0
        fail_msg: >-
          No receptor settings were found in the install bundle. Check the
          bundle file list above and the layout of install_receptor.yml.

- name: Install receptor on the VM
  hosts: "{{ register_execution_node_vm_name }}"
  gather_facts: true
  become: true
  tasks:
    - name: Load receptor settings from the bundle
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ hostvars['localhost'].register_execution_node_receptor_vars | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Install and configure receptor
      ansible.builtin.include_role:
        name: ansible.receptor.setup

    - name: Verify receptor is running
      ansible.builtin.command: systemctl is-active receptor
      register: register_execution_node_service
      changed_when: false

    - name: Verify receptor is listening on the mesh port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ receptor_port | default(27199) }}"
        timeout: 60

- name: Add the execution node to an instance group and wait for it
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    register_execution_node_api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}/api/controller/v2"
    register_execution_node_token: "{{ lookup('ansible.builtin.env', 'CONTROLLER_OAUTH_TOKEN') }}"
  module_defaults:
    ansible.builtin.uri:
      headers: "{{ {'Authorization': 'Bearer ' ~ register_execution_node_token} if register_execution_node_token | length > 0 else {} }}"
      url_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') if register_execution_node_token | length == 0 else omit }}"
      url_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') if register_execution_node_token | length == 0 else omit }}"
      force_basic_auth: "{{ register_execution_node_token | length == 0 }}"
      validate_certs: "{{ (lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') | default('true', true)) | bool }}"
  tasks:
    - name: Add the instance to the instance group
      ansible.controller.instance_group:
        name: "{{ register_execution_node_instance_group | default('storage') }}"
        instances:
          - "{{ register_execution_node_hostname }}"
        state: present

    # Jobs that use this inventory run on the storage instance group.
    - name: Run storage inventory jobs on the instance group
      ansible.controller.inventory:
        name: "{{ register_execution_node_inventory_name | default('Ansible Product Demos Storage Inventory') }}"
        organization: Ansible Product Demos (APD)
        instance_groups:
          - "{{ register_execution_node_instance_group | default('storage') }}"

    # The control plane dials the node on its listener port, so a failure here
    # (for example "not in the receptor mesh") means AAP cannot reach it.
    - name: Run an AAP health check on the node
      ansible.builtin.uri:
        url: "{{ register_execution_node_api }}/instances/{{ register_execution_node_instance_id }}/health_check/"
        method: POST
        status_code: [200, 202]

    - name: Wait for the health check to pass
      ansible.builtin.uri:
        url: "{{ register_execution_node_api }}/instances/{{ register_execution_node_instance_id }}/health_check/"
      register: register_execution_node_health
      until:
        - register_execution_node_health.json.last_health_check | default(none) is not none
        - register_execution_node_health.json.errors | default('') | length == 0
      retries: 30
      delay: 10
...
