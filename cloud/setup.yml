---
_deployment_id: '{{ lookup("ansible.builtin.password", playbook_dir + "/.deployment_id", chars=["ascii_lowercase", "digits"], length=5) }}'
apd_managed_by: aap-product-demos

user_message:
  - >-
    To enable automatic RHSM registration on unregistered RHEL hosts,
    update the 'RHSM Registration' credential in AAP with your org ID
    and activation key. https://access.redhat.com/management/activation_keys

controller_credential_types:
  - name: RHSM Activation Key
    kind: cloud
    inputs:
      fields:
        - id: rhsm_org_id
          type: string
          label: Organization ID
        - id: rhsm_activation_key
          type: string
          label: Activation Key
          secret: true
      required:
        - rhsm_org_id
        - rhsm_activation_key
    injectors:
      extra_vars:
        rhsm_org_id: !unsafe '{{ rhsm_org_id }}'
        rhsm_activation_key: !unsafe '{{ rhsm_activation_key }}'

controller_credentials:
  - name: RHSM Registration
    credential_type: RHSM Activation Key
    organization: Ansible Product Demos (APD)
    update_secrets: false
    state: exists
    inputs:
      rhsm_org_id: REPLACEME
      rhsm_activation_key: REPLACEME

controller_execution_environments:
  - name: TMM AWS EE
    image: quay.io/acme_corp/aws_ee
    organization: Ansible Product Demos (APD)
    pull: missing

# Holds the FSx ONTAP systems. The "storage" instance group (the execution
# node registered by Deploy a Storage Stack on AWS) is attached to this
# inventory by cloud/register_execution_node.yml, so jobs run against ONTAP
# hosts execute on that node.
controller_inventories:
  - name: Ansible Product Demos Storage Inventory
    description: Amazon FSx for NetApp ONTAP systems managed from the storage execution node
    organization: Ansible Product Demos (APD)

controller_templates:
  - name: Cloud | AWS | Create Peer Infrastructure
    labels:
      - aws.vpc
    job_type: run
    organization: Ansible Product Demos (APD)
    credentials:
      - AWS
    project: Ansible Product Demos
    playbook: cloud/create_peer_network.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      aws_region: us-east-1
      dmz_ssh_key_name: aws-test-key
      priv_network_ssh_key_name: aws-test-key
      apd_id: "{{ _deployment_id }}"
      apd_managed_by: "{{ apd_managed_by }}"

  - name: Cloud | AWS | Delete Peer Infrastructure
