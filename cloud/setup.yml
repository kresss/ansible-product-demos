    project: Ansible Product Demos
    playbook: cloud/delete_fsx_ontap.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          question_description: >-
            AWS region where the FSx ONTAP stack was created. Optional when
            launched from Destroy a Storage Stack on AWS, which supplies the region.
          type: multiplechoice
          variable: delete_fsx_ontap_aws_region
          required: false
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
        - question_name: FSx ONTAP Stack Name
          question_description: >-
            Name of the CloudFormation stack to delete. Deleting the stack
            also deletes the FSx ONTAP file system and all of its data.
          type: text
          variable: delete_fsx_ontap_stack_name
          required: true
          default: aws-ontap-stack
        - question_name: FSx ONTAP Name
          question_description: >-
            Name used when the file system was created. The host with this
            name is removed from Ansible Product Demos Storage Inventory.
          type: text
          variable: delete_fsx_ontap_aws_name
          required: false
