    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          question_description: >-
            AWS region where the VM was created. Optional when launched from
            Deploy a Storage Stack on AWS, which supplies the region.
          type: multiplechoice
          variable: register_execution_node_aws_region
          required: false
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
        - question_name: VM Name
          question_description: >-
            Name tag of the RHEL VM to register as an AAP execution node. It
            must already be in Ansible Product Demos Inventory.
          type: text
          variable: register_execution_node_vm_name
          required: true
          default: aws-storage-node
        - question_name: Instance Group
          question_description: >-
            AAP instance group the execution node is added to.
          type: text
          variable: register_execution_node_instance_group
          required: false
          default: storage

  - name: Cloud | AWS | Check FSx ONTAP Endpoint
    labels:
      - storage
    job_type: run
    organization: Ansible Product Demos (APD)
    credentials:
      - APD Machine Credential
    project: Ansible Product Demos
    playbook: cloud/check_fsx_ontap_endpoint.yml
    # Must use the storage inventory so the job runs on the execution node.
    inventory: Ansible Product Demos Storage Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry

  - name: Cloud | AWS | Deregister Execution Node
    labels:
      - storage
    job_type: run
    organization: Ansible Product Demos (APD)
    credentials:
      - AWS
      - AAP Credential
    project: Ansible Product Demos
    playbook: cloud/deregister_execution_node.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          question_description: >-
            AWS region where the VM was created. Optional when launched from
            Destroy a Storage Stack on AWS, which supplies the region.
          type: multiplechoice
          variable: deregister_execution_node_aws_region
          required: false
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
        - question_name: VM Name
          question_description: >-
            Name tag of the RHEL VM registered as an AAP execution node. It
            must still be running so AAP can uninstall receptor from it.
          type: text
          variable: deregister_execution_node_vm_name
          required: true
          default: aws-storage-node

controller_workflows:
  - name: Deploy Cloud Stack in AWS
    description: A workflow to deploy a cloud stack
    labels:
      - aws.ec2
      - aws.vpc
      - rhel
      - windows
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      aws_key_name: aws-test-key
      create_vm_aws_keypair_name: aws-test-key
      create_vm_aws_securitygroup_name: aws-test-sg
      create_vm_aws_vpc_subnet_name: aws-test-subnet
      create_vm_vm_deployment: cloud_stack
      create_vm_vm_purpose: demo
      create_vm_apd_managed_by: aap-product-demos
      create_vm_apd_demo_tag: "true"
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          question_description: >-
            AWS region where the VPC, keypair, and all VMs will be created.
          type: multiplechoice
          variable: create_vm_aws_region
          required: true
          default: us-east-2
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
        - question_name: Owner
          question_description: >-
            Value for the EC2 tag key "owner" on all resources this workflow
            creates. Use your name or team for cost attribution; appears in
            inventory keyed groups as owner_*.
          type: text
          variable: create_vm_aws_owner_tag
          required: true
          default: your_name
        - question_name: Environment
          question_description: >-
            Value for the EC2 tag key "environment" on each VM (Dev, QA, or
            Prod). Metadata only—it does not change instance size, patching, or
            security settings.
          type: multiplechoice
          variable: vm_environment
          required: true
          default: Prod
          choices:
            - Dev
            - QA
            - Prod
        - question_name: Email
          question_description: >-
            Operator contact at launch. Not written to EC2 tags and not consumed
            by the deploy playbooks today; kept for optional demo-environment
            tracking. Replace the default with your address.
          type: text
          variable: email
          required: true
          default: your_name@acme.org
    simplified_workflow_nodes:
      - identifier: Create Keypair
        unified_job_template: Cloud | AWS | Create Keypair
        success_nodes:
          - EC2 Stats
        failure_nodes:
          - Ticket - Keypair Failed
      - identifier: Create VPC
        unified_job_template: Cloud | AWS | Create VPC
        success_nodes:
          - EC2 Stats
        failure_nodes:
          - Ticket - VPC Failed
      - identifier: Ticket - Keypair Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to create AWS keypair
      - identifier: EC2 Stats
        unified_job_template: Cloud | AWS | Display EC2 Stats
        all_parents_must_converge: true
        always_nodes:
          - Deploy Windows GUI Blueprint
          - Deploy RHEL9 Blueprint
          - Deploy RHEL10 Blueprint
          - Deploy Windows Core Blueprint
          - Deploy Report Server
      - identifier: Deploy Windows GUI Blueprint
        unified_job_template: Cloud | AWS | Create VM
        extra_data:
          create_vm_vm_name: aws-dc
          vm_blueprint: windows_full
        success_nodes:
          - Update Inventory
        failure_nodes:
          - Ticket - Instance Failed
      - identifier: Deploy Windows Core Blueprint
        unified_job_template: Cloud | AWS | Create VM
        extra_data:
          create_vm_vm_name: aws_win1
          vm_blueprint: windows_core
        success_nodes:
          - Update Inventory
        failure_nodes:
          - Ticket - Instance Failed
      - identifier: Deploy RHEL9 Blueprint
        unified_job_template: Cloud | AWS | Create VM
        extra_data:
          create_vm_vm_name: aws-rhel9
          vm_blueprint: rhel9
        success_nodes:
          - Update Inventory
        failure_nodes:
          - Ticket - Instance Failed
      - identifier: Deploy RHEL10 Blueprint
        unified_job_template: Cloud | AWS | Create VM
        extra_data:
          create_vm_vm_name: aws-rhel10
          vm_blueprint: rhel10
        success_nodes:
          - Update Inventory
        failure_nodes:
          - Ticket - Instance Failed
      - identifier: Deploy Report Server
        unified_job_template: Cloud | AWS | Create VM
        extra_data:
          create_vm_vm_name: reports
          vm_blueprint: rhel9
        success_nodes:
          - Update Inventory
        failure_nodes:
          - Ticket - Instance Failed
      - identifier: Update Inventory
        unified_job_template: AWS Inventory
        success_nodes:
          - Publish VPC Report
      - identifier: Ticket - Instance Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to create AWS instance
      - identifier: Publish VPC Report
        unified_job_template: Cloud | AWS | VPC Report
      - identifier: Ticket - VPC Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to create AWS VPC

  - name: Destroy Cloud Stack in AWS
    description: Tear down the cloud stack VMs, VPC, and keypair created by Deploy Cloud Stack in AWS
    labels:
      - aws.ec2
      - aws.vpc
      - rhel
      - windows
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          question_description: >-
            AWS region where the cloud stack was deployed.
          type: multiplechoice
          variable: create_vm_aws_region
          required: true
          default: us-east-2
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
    simplified_workflow_nodes:
      - identifier: Delete Windows GUI VM
        unified_job_template: Cloud | AWS | Delete Stack VM
        extra_data:
          create_vm_vm_name: aws-dc
        success_nodes:
          - Update Inventory
      - identifier: Delete Windows Core VM
        unified_job_template: Cloud | AWS | Delete Stack VM
        extra_data:
          create_vm_vm_name: aws_win1
        success_nodes:
          - Update Inventory
      - identifier: Delete RHEL9 VM
        unified_job_template: Cloud | AWS | Delete Stack VM
        extra_data:
          create_vm_vm_name: aws-rhel9
        success_nodes:
          - Update Inventory
      - identifier: Delete RHEL10 VM
        unified_job_template: Cloud | AWS | Delete Stack VM
        extra_data:
          create_vm_vm_name: aws-rhel10
        success_nodes:
          - Update Inventory
      - identifier: Delete Report Server
        unified_job_template: Cloud | AWS | Delete Stack VM
        extra_data:
          create_vm_vm_name: reports
        success_nodes:
          - Update Inventory
      - identifier: Update Inventory
        unified_job_template: AWS Inventory
        all_parents_must_converge: true
        success_nodes:
          - Delete Keypair
          - Delete VPC
      - identifier: Delete Keypair
        unified_job_template: Cloud | AWS | Delete Keypair
        all_parents_must_converge: true
      - identifier: Delete VPC
        unified_job_template: Cloud | AWS | Delete VPC
        all_parents_must_converge: true

  - name: Patch Cloud Stack in AWS
    description: >-
      Snapshot, pre-check, patch, post-check (or rollback on failure), and
      compliance report for both RHEL and Windows EC2 instances.
      Based on jopaik/patch_demo.
    labels:
      - aws.ec2
      - aws.vpc
      - patching
      - rhel
      - windows
    organization: Ansible Product Demos (APD)
    allow_simultaneous: true
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      _hosts: aws-rhel9:aws-rhel10
      _hosts_windows: aws-dc:aws_win1
      _report_server: reports
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          type: multiplechoice
          variable: aws_region
          required: true
          default: us-east-2
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
        - question_name: RHEL hosts
          question_description: >-
            Workload VMs to snapshot and patch on the RHEL path.
            Default is aws-rhel9:aws-rhel10. Does not include reports or aws_kafka.
          type: text
          variable: _hosts
          required: true
          default: aws-rhel9:aws-rhel10
        - question_name: Windows hosts
          question_description: >-
            Workload VMs to snapshot and patch on the Windows path.
            Default is aws-dc:aws_win1 (both cloud-stack Windows hosts).
          type: text
          variable: _hosts_windows
          required: true
          default: aws-dc:aws_win1
        - question_name: Report server
          question_description: >-
            Host that publishes the HTML compliance dashboard. Not patched.
            Default is reports.
          type: text
          variable: _report_server
          required: true
          default: reports
        - question_name: RHEL Advisory IDs (comma-separated)
          type: text
          variable: input_cve_ids
          required: false
          default: "RHSA-2024:3138, CVE-2024-33599"
        - question_name: Windows KB IDs (comma-separated)
          type: text
          variable: input_kb_ids
          required: false
          default: "KB5044284, KB5044030"
    simplified_workflow_nodes:
      - identifier: Take Snapshot
        unified_job_template: Cloud | AWS | Snapshot EC2
        success_nodes:
          - Pre-check RHEL
          - Pre-check Windows
      - identifier: Pre-check RHEL
        unified_job_template: Cloud | AWS | Patch Pre-check RHEL
        success_nodes:
          - Patch RHEL
      - identifier: Pre-check Windows
        unified_job_template: Cloud | AWS | Patch Pre-check Windows
        success_nodes:
          - Patch Windows
      - identifier: Patch RHEL
        unified_job_template: Cloud | AWS | Patch RHEL
        success_nodes:
          - Post-check RHEL
        failure_nodes:
          - Restore RHEL
      - identifier: Patch Windows
        unified_job_template: Cloud | AWS | Patch Windows
        success_nodes:
          - Post-check Windows
        failure_nodes:
          - Restore Windows
      - identifier: Post-check RHEL
        unified_job_template: Cloud | AWS | Patch Post-check RHEL
        always_nodes:
          - Compliance Report
      - identifier: Restore RHEL
        unified_job_template: Cloud | AWS | Restore EC2 from Snapshot
      - identifier: Post-check Windows
        unified_job_template: Cloud | AWS | Patch Post-check Windows
        always_nodes:
          - Compliance Report
      - identifier: Restore Windows
        unified_job_template: Cloud | AWS | Restore EC2 from Snapshot
      - identifier: Compliance Report
        unified_job_template: Cloud | AWS | Patch Compliance Report
        extra_data:
          _report_server: reports
        limit: all
        all_parents_must_converge: true

  - name: Deploy a Storage Stack on AWS
    description: >-
      Deploy a RHEL VM registered as an AAP execution node for managing
      storage, and an Amazon FSx for NetApp ONTAP file system that is added
      to the storage inventory. Requires the keypair and VPC created by
      Deploy Cloud Stack in AWS, so run that workflow first.
    labels:
      - aws.ec2
      - rhel
      - storage
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      create_vm_aws_keypair_name: aws-test-key
      create_vm_aws_securitygroup_name: aws-test-sg
      create_vm_aws_vpc_subnet_name: aws-test-subnet
      create_vm_vm_deployment: storage_stack
      create_vm_vm_purpose: demo
      create_vm_apd_managed_by: aap-product-demos
      create_vm_apd_demo_tag: "true"
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          question_description: >-
            AWS region where the VPC, keypair, VM, and FSx ONTAP will be created.
          type: multiplechoice
          variable: create_vm_aws_region
          required: true
          default: us-east-2
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
        - question_name: Owner
          question_description: >-
            Value for the EC2 tag key "owner" on the VM.
          type: text
          variable: create_vm_aws_owner_tag
          required: true
          default: your_name
        - question_name: Environment
          question_description: >-
            Value for the EC2 tag key "environment" on the VM (Dev, QA, or Prod).
          type: multiplechoice
          variable: vm_environment
          required: true
          default: Prod
          choices:
            - Dev
            - QA
            - Prod
        - question_name: Email
          question_description: >-
            Operator contact at launch. Not written to EC2 tags.
          type: text
          variable: email
          required: true
          default: your_name@acme.org
    simplified_workflow_nodes:
      - identifier: Deploy Storage Node
        unified_job_template: Cloud | AWS | Create VM
        extra_data:
          create_vm_vm_name: aws-storage-node
          vm_blueprint: rhel9
        success_nodes:
          - Update Inventory
        failure_nodes:
          - Ticket - Instance Failed
      - identifier: Update Inventory
        unified_job_template: AWS Inventory
        success_nodes:
          - Register Execution Node
      - identifier: Register Execution Node
        unified_job_template: Cloud | AWS | Register Execution Node
        extra_data:
          register_execution_node_vm_name: aws-storage-node
          register_execution_node_instance_group: storage
        success_nodes:
          - Check FSx Endpoint
        failure_nodes:
          - Ticket - Execution Node Failed
      - identifier: Create FSx ONTAP
        unified_job_template: Cloud | AWS | Create FSx ONTAP
        extra_data:
          create_fsx_ontap_aws_name: aws-ontap
          create_fsx_ontap_stack_name: aws-ontap-stack
          create_fsx_ontap_aws_vpc_subnet_name: aws-test-subnet
          create_fsx_ontap_aws_securitygroup_name: aws-test-sg
        success_nodes:
          - Update FSx Inventory
        failure_nodes:
          - Ticket - FSx Failed
      - identifier: Update FSx Inventory
        unified_job_template: Cloud | AWS | Update FSx ONTAP Inventory
        success_nodes:
          - Check FSx Endpoint
        failure_nodes:
          - Ticket - FSx Inventory Failed
      # Runs on the execution node, so it only starts once the node is
      # registered and the FSx system is in the storage inventory.
      - identifier: Check FSx Endpoint
        unified_job_template: Cloud | AWS | Check FSx ONTAP Endpoint
        all_parents_must_converge: true
        failure_nodes:
          - Ticket - FSx Endpoint Failed
      - identifier: Ticket - FSx Endpoint Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: FSx ONTAP management endpoint is not reachable from the execution node
      - identifier: Ticket - FSx Inventory Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to add FSx ONTAP to the storage inventory
      - identifier: Ticket - Instance Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to create AWS storage node instance
      - identifier: Ticket - Execution Node Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to register execution node
      - identifier: Ticket - FSx Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to create FSx ONTAP

  - name: Destroy a Storage Stack on AWS
    description: >-
      Tear down what Deploy a Storage Stack on AWS created: the FSx ONTAP
      file system and its inventory host, and the storage execution node
      (deregistered from AAP, then its VM deleted). The keypair and VPC from
      Deploy Cloud Stack in AWS are left in place; use Destroy Cloud Stack in
      AWS for those.
    labels:
      - aws.ec2
      - rhel
      - storage
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          question_description: >-
            AWS region where the storage stack was deployed.
          type: multiplechoice
          variable: create_vm_aws_region
          required: true
          default: us-east-2
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
    simplified_workflow_nodes:
      - identifier: Delete FSx ONTAP
        unified_job_template: Cloud | AWS | Delete FSx ONTAP
        extra_data:
          delete_fsx_ontap_stack_name: aws-ontap-stack
          delete_fsx_ontap_aws_name: aws-ontap
        failure_nodes:
          - Ticket - FSx Delete Failed
      # The node must be deregistered while its VM is still running.
      - identifier: Deregister Execution Node
        unified_job_template: Cloud | AWS | Deregister Execution Node
        extra_data:
          deregister_execution_node_vm_name: aws-storage-node
        success_nodes:
          - Delete Storage Node
        failure_nodes:
          - Ticket - Deregister Failed
      - identifier: Delete Storage Node
        unified_job_template: Cloud | AWS | Delete Stack VM
        extra_data:
          create_vm_vm_name: aws-storage-node
        success_nodes:
          - Update Inventory
        failure_nodes:
          - Ticket - VM Delete Failed
      - identifier: Update Inventory
        unified_job_template: AWS Inventory
      - identifier: Ticket - FSx Delete Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to delete FSx ONTAP
      - identifier: Ticket - Deregister Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to deregister the storage execution node
      - identifier: Ticket - VM Delete Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to delete the storage node instance
