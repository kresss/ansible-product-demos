  - name: Cloud | AWS | Register Execution Node
    labels:
      - storage
    job_type: run
    organization: Ansible Product Demos (APD)
    credentials:
      - AWS
      - AAP Credential
      - APD Machine Credential
      - RHSM Registration
    project: Ansible Product Demos
