  - name: Cloud | AWS | Create FSx ONTAP
    labels:
      - storage
    job_type: run
    organization: Ansible Product Demos (APD)
    credentials:
      - AWS
      - APD Machine Credential
    project: Ansible Product Demos
    playbook: cloud/create_fsx_ontap.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          question_description: >-
            AWS region where the FSx ONTAP will be created. Optional when
            launched from Deploy a Storage Stack on AWS, which supplies the region.
          type: multiplechoice
          variable: create_fsx_ontap_aws_region
          required: false
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
        - question_name: FSx ONTAP Name
          question_description: >-
            Name for the FSx ONTAP file system. Will be used as the value for
            the EC2 tag key "Name" on the FSx ONTAP file system.
          type: text
          variable: create_fsx_ontap_aws_name
          required: true
          default: aws-ontap
        - question_name: FSx ONTAP Stack Name
          question_description: >-
            Name for the collection of ONTAP nodes. This dominates the
            FSx ONTAP Name
          type: text
          variable: create_fsx_ontap_stack_name
          required: true
          default: aws-ontap-stack
        - question_name: Owner
          question_description: >-
            Value for the EC2 tag key "owner" on all resources this workflow
            creates. Use your name or team for cost attribution; appears in
            inventory keyed groups as owner_*.
          type: text
          variable: create_fsx_ontap_aws_owner_tag
          required: false
        - question_name: Environment
          question_description: >-
            Value for the EC2 tag key "environment" on FSx ONTAP (Dev, QA, or
            Prod). Metadata only—it does not change settings.
          type: multiplechoice
          variable: create_fsx_ontap_aws_environment
          required: false
          choices:
            - Dev
            - QA
            - Prod
        - question_name: Subnet
          type: text
          variable: create_fsx_ontap_aws_vpc_subnet_name
          required: true
          default: aws-test-subnet
        - question_name: Security Group
          type: text
          variable: create_fsx_ontap_aws_securitygroup_name
          required: true
          default: aws-test-sg

