---
- name: Create a Nested VM on a RHEL Host
  hosts: "{{ _hosts | default(omit)  }}"
  become: true

  vars:
    primary_interface: eth0
    bridge_interface: virbr1
    virt_network_name: "one-to-one-nat"

  tasks:
    - name: Check for vars
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name != ''
          - vm_name != 'undef'
          - vm_os_image is defined
          - vm_os_image != ''
          - vm_os_image != 'undef'
          - aws_secondary_ip is defined
          - aws_secondary_ip != ''
          - aws_secondary_ip != 'undef'
        msg: "Required variables not set. Please provide vm_name, and aws_secondary_ip."

    - name: Ensure libvirt is installed
      ansible.builtin.dnf:
        name:
          - libvirt
          - qemu-kvm
          - libguestfs-tools
          - python3-libvirt
          - virt-install
          - python3-lxml
          - guestfs-tools
          - firewalld
        state: present

    - name: Ensure libvirtd service is running and enabled
      ansible.builtin.service:
        name: libvirtd
        state: started
        enabled: true

    - name: Ensure firewalld service is running and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Add user to libvirt group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: libvirt
        append: true

    - name: Enable global IP forwarding in firewalld
      ansible.posix.firewalld:
        forward: true
        permanent: true
        state: enabled

    - name: Enable masquerading in public zone
      ansible.posix.firewalld:
        masquerade: true
        zone: public
        permanent: true
        state: enabled

    - name: Assign interfaces to appropriate firewalld zones
      ansible.posix.firewalld:
        zone: "{{ item.zone }}"
        interface: "{{ item.interface }}"
        permanent: true
        state: enabled
      loop:
        - { zone: 'public', interface: '{{ primary_interface }}' }
        - { zone: 'trusted', interface: '{{ bridge_interface }}' }

    - name: Check if network is defined via virsh
      ansible.builtin.command:
        cmd: "virsh net-info {{ virt_network_name }}"
      register: virsh_check
      failed_when: false
      changed_when: false

    - name: Set existence fact
      ansible.builtin.set_fact:
        net_exists: "{{ virsh_check.rc == 0 }}"
      failed_when: false
      changed_when: false

    - name: Define Virt Network
      when: not net_exists
      block:
        - name: Generate network XML configuration
          ansible.builtin.template:
            src: network_config.xml.j2
            dest: "/tmp/{{ virt_network_name }}.xml"
            mode: '0600'

        - name: Define, start, and autostart new virt network
          ansible.builtin.shell: |
            virsh net-define /tmp/{{ virt_network_name }}.xml
            virsh net-start {{ virt_network_name }}
            virsh net-autostart {{ virt_network_name }}

    - name: Download VM OS Image
      ansible.builtin.get_url:
        url: "{{ vm_os_image }}"
        dest: "/tmp/my_os_image.qcow2"
        mode: "0644"

    - name: Copy image to libvirt directory
      ansible.builtin.copy:
        src: "/tmp/my_os_image.qcow2"
        dest: "/var/lib/libvirt/images/{{ vm_name }}.qcow2"
        remote_src: true
        owner: qemu
        group: qemu
        mode: "0660"
      register: copy_results

    - name: Check if the VM is already defined
      ansible.builtin.command:
        cmd: "virsh dominfo {{ vm_name }}"
      register: vm_definition_check
      failed_when: false
      changed_when: false

    - name: Define the VM
      ansible.builtin.template:
        src: "templates/nested_vm_def.xml.j2"
        dest: "/tmp/{{ vm_name }}.xml"
        owner: root
        group: root
        mode: "0644"

    # NOTE: Through out this playbook we are not using community.libvirt.virt
    # module because it isn't in the stock supported-ee collections.
    - name: Define the VM in libvirt using virsh
      ansible.builtin.command:
        cmd: "virsh define /tmp/{{ vm_name }}.xml"
      when: vm_definition_check.rc != 0
      register: vm_define_result
      changed_when: vm_define_result.rc == 0

    - name: Check if the VM is already started
      ansible.builtin.command:
        cmd: "virsh domstate {{ vm_name }}"
      register: vm_state_check
      failed_when: false
      changed_when: false

    - name: Start the VM
      ansible.builtin.command:
        cmd: "virsh start {{ vm_name }}"
      when: vm_state_check.stdout | trim != 'running'
      register: vm_start_result
      changed_when: vm_start_result.rc == 0

    - name: Gather DHCP IP address of the VM
      ansible.builtin.command: >
        virsh domifaddr --domain {{ vm_name }}
      register: virsh_output
      changed_when: false
      until: virsh_output.stdout_lines | length >= 3
      retries: 5
      delay: 5

    - name: Parse and set the VM IP address from virsh output
      ansible.builtin.set_fact:
        vm_ip: "{{ virsh_output.stdout_lines[2] | regex_search('[0-9]{1,3}(?:[.][0-9]{1,3}){3}') }}"
        vm_mac: "{{ virsh_output.stdout_lines[2] | regex_search('([0-9a-fA-F]{2}[:-]){5}([0-9a-fA-F]{2})') }}"

    - name: Fail if VM IP address could not be found
      ansible.builtin.fail:
        msg: "Could not find a DHCP IP address for VM: {{ vm_name }}. Ensure the VM is running."
      when: vm_ip is none or vm_ip == ""

    - name: Fail if VM MAC address could not be found
      ansible.builtin.fail:
        msg: "Could not find a MAC address for VM: {{ vm_name }}. Ensure the VM is running."
      when: vm_mac is none or vm_mac == ""

    - name: Get libvirt network configuration - {{ virt_network_name }}
      ansible.builtin.command:
        cmd: "virsh net-dumpxml {{ virt_network_name }}"
      register: dhcp_reservation_check
      failed_when: false
      changed_when: false

    - name: Build the expected DHCP host reservation XML
      ansible.builtin.set_fact:
        expected_dhcp_reservation: "<host mac='{{ vm_mac }}' name='{{ vm_name }}' ip='{{ vm_ip }}'/>"

    - name: Set fact for if the static DHCP host reservation already exists
      ansible.builtin.set_fact:
        vm_reservation_exists: "{{ dhcp_reservation_check.stdout.find(expected_dhcp_reservation) != -1 }}"

    - name: Add static DHCP host reservation to libvirt network live
      ansible.builtin.command:
        cmd: >
          virsh net-update {{ virt_network_name }} add ip-dhcp-host "{{ expected_dhcp_reservation }}" --live --config
      register: virsh_update
      failed_when:
        - virsh_update.rc != 0
        - "'already exists' not in virsh_update.stderr"
      changed_when: virsh_update.rc == 0
      when: not vm_reservation_exists

    - name: Deploy firewalld 1-to-1 NAT direct rules via XML
      ansible.builtin.copy:
        dest: /etc/firewalld/direct.xml
        owner: root
        group: root
        mode: '0644'
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <direct>
            <rule priority="0" table="nat" chain="PREROUTING" ipv="ipv4">-d {{ aws_secondary_ip }} -j DNAT --to-destination {{ vm_ip }}</rule>
            <rule priority="0" table="nat" chain="POSTROUTING" ipv="ipv4">-s {{ vm_ip }} -o {{ primary_interface }} -j SNAT --to-source {{ aws_secondary_ip }}</rule>
          </direct>
      notify: Reload firewalld

  handlers:
    - name: Reload firewalld
      ansible.builtin.command:
        cmd: "firewall-cmd --reload"
