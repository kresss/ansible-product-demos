---
- name: Create a Nested VM on a RHEL Host
  hosts: "{{ _hosts | default(omit)  }}"
  become: true

  vars:
    host_port: "{{ _host_port | default(8080) }}"
    vm_port: "{{ _vm_port | default(80) }}"

  tasks:
    - name: Check for vars
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name != ''
          - vm_name != 'undef'
          - vm_os_image is defined
          - vm_os_image != ''
          - vm_os_image != 'undef'

    - name: Ensure libvirt is installed
      ansible.builtin.dnf:
        name:
          - libvirt
          - qemu-kvm
          - libguestfs-tools
          - python3-libvirt
          - virt-install
          - python3-lxml
          - guestfs-tools
        state: present

    - name: Ensure libvirtd service is running and enabled
      ansible.builtin.service:
        name: libvirtd
        state: started
        enabled: true

    - name: Add user to libvirt group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: libvirt
        append: true

    - name: Download VM OS Image
      ansible.builtin.get_url:
        url: "{{ vm_os_image }}"
        dest: "/tmp/my_os_image.qcow2"
        mode: "0644"

    - name: Get MD5 checksum of a file
      ansible.builtin.stat:
        path: "/tmp/my_os_image.qcow2"
        checksum_algorithm: md5
      register: file_stat

    - name: Display the MD5 checksum
      ansible.builtin.debug:
        msg: "The MD5 checksum is {{ file_stat.stat.checksum }}"
      when: file_stat.stat.exists

    - name: Copy image to libvirt directory
      ansible.builtin.copy:
        src: "/tmp/my_os_image.qcow2"
        dest: "/var/lib/libvirt/images/{{ vm_name }}.qcow2"
        remote_src: true
        owner: qemu
        group: qemu
        mode: "0660"
      register: copy_results

    # - name: Enable HTTPD on Nested VM Image
    #   ansible.builtin.shell: >
    #     virt-customize
    #     -a /var/lib/libvirt/images/{{ vm_name }}.qcow2
    #     --hostname {{ vm_name }}
    #     --uninstall cloud-init
    #     --selinux-relabel
    #   when: copy_results is changed
    #   args:
    #     executable: /bin/bash

    - name: Define the VM
      ansible.builtin.template:
        src: "templates/nested_vm_def.xml.j2"
        dest: "/tmp/{{ vm_name }}.xml"

    # Not using community.libvirt.virt module because it isn't in the stock supported-ee collections.
    - name: Define the VM in libvirt using virsh
      ansible.builtin.command:
        cmd: "virsh define /tmp/{{ vm_name }}.xml"

    - name: Start the VM
      ansible.builtin.command:
        cmd: "virsh start {{ vm_name }}"

    - name: Get the VM MAC address from libvirt
      ansible.builtin.shell: |
        set -o pipefail
        virsh domiflist my-vm | awk 'NR>2 {print $5}' | head -n 1
      args:
        executable: /bin/bash
      register: vm_mac
      changed_when: false

    - name: Wait for VM network initialization and locate ARP entry
      block:
        - name: Force host to update ARP table and extract VM IP
          ansible.builtin.shell: |
            set -o pipefail
            # Ping the network broadcast or check neighbors to wake up stale entries
            ip neighbor show > /dev/null
            
            # Search the local ARP / Neighbor cache for the specific MAC address
            ip neighbor show | grep -i "{{ vm_mac.stdout | trim }}" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}'
          args:
            executable: /bin/bash
          register: arp_output
          # Loop configuration: Retries every 5 seconds for up to 1 minute
          until: arp_output.stdout | trim != ""
          retries: 12
          delay: 5
          changed_when: false

        - name: Store the found IP address
          ansible.builtin.set_fact:
            vm_ip: "{{ arp_output.stdout | trim }}"

    - name: Display the discovered IP address
      ansible.builtin.debug:
        msg: "Successfully found VM IP: {{ vm_ip }}"

    - name: Enable IP masquerading on the host firewall
      ansible.posix.firewalld:
        zone: "public"
        masquerade: true
        permanent: true
        state: enabled
      notify: Reload firewalld

    - name: Configure port forwarding from host to VM
      ansible.posix.firewalld:
        zone: "public"
        forward_port: "port={{ host_port }}:proto=tcp:toport={{ vm_port }}:toaddr={{ vm_ip }}"
        permanent: true
        state: enabled
      notify: Reload firewalld

    - name: Enable IPv4 forwarding in sysctl
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

  handlers:
    - name: Reload firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: reloaded
